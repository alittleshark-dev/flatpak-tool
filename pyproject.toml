[project]
name = "flatpak-tool"
version = "0.1.0"
description = "A terminal (TUI) tool to manage Flatpak apps, remotes and app lists."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "alittleshark-dev", email = "alittleshark2@gmail.com" }
]
requires-python = ">=3.11.9"
keywords = ["flatpak", "tui", "cli", "package-manager"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    "simple-term-menu>=1.6.6",
]

[project.scripts]
flatpak-tool = "flatpak_tool:main"

[project.urls]
Homepage = "https://github.com/alittleshark-dev/flatpak-tool"
Repository = "https://github.com/alittleshark-dev/flatpak-tool"
Issues = "https://github.com/alittleshark-dev/flatpak-tool/issues"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
